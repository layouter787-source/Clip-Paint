name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Clip Paint (Kotlin + C++)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null

      - name: Extract original CodeAssist project
        run: |
          test -f "clip-paint-pro (3).caproj"
          mkdir -p /tmp/clip-paint-caproj
          unzip -q "clip-paint-pro (3).caproj" -d /tmp/clip-paint-caproj
          test -d /tmp/clip-paint-caproj/project/app/src/main
          rm -rf app/src/main
          mkdir -p app/src/main
          cp -a /tmp/clip-paint-caproj/project/app/src/main/. app/src/main/
          test -f app/src/main/kotlin/com/clippaint/HomeActivity.kt
          test -f app/src/main/cpp/jni_bridge.cpp
          test -f app/src/main/assets/animbrush/stamps.abpack

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clip-paint-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
