name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Clip Paint (Kotlin + C++)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and native toolchains
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1

      - name: Extract the complete CodeAssist project
        run: |
          test -f "clip-paint-pro (3).caproj"
          mkdir -p /tmp/clip-paint-caproj
          unzip -q "clip-paint-pro (3).caproj" -d /tmp/clip-paint-caproj
          test -d /tmp/clip-paint-caproj/project/app/src/main
          cp -a /tmp/clip-paint-caproj/project/. .
          test -f .platform/workspace.json
          test -f README.md
          test -f app/module.toml
          test -f app/src/main/kotlin/com/clippaint/HomeActivity.kt
          test -f app/src/main/cpp/jni_bridge.cpp
          test -f app/src/main/assets/animbrush/stamps.abpack

      - name: Publish extracted project files to the repository
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .platform README.md app/module.toml app/src/main
          if git diff --cached --quiet; then
            echo "All CodeAssist project files are already committed."
          else
            git commit -m "Import complete CodeAssist project from caproj [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Apply Kotlin compatibility patch
        run: patch --forward -p1 < ci/patches/001-kotlin-dp-jvm-signature.patch

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clip-paint-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
